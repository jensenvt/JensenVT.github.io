<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JensenVT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1814;
      --card-bg: #242018;
      --border: #3a3528;
      --border-hover: #5a5040;
      --text: #e8e0d0;
      --text-muted: #7a7060;
      --text-link: #c8bfae;
      --arrow: #4a4438;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      padding: 2.5rem 1rem;
    }

    /* subtle noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #2e2a24;
      border: 1.5px solid #3d382f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 14px;
    }

    .name {
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 13px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      margin-bottom: 30px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 18px;
      background: var(--card-bg);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text-link);
      font-size: 14px;
      font-weight: 400;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      animation: fadeUp 0.6s ease both;
    }

    .link-btn:nth-child(1) { animation-delay: 0.05s; }
    .link-btn:nth-child(2) { animation-delay: 0.10s; }
    .link-btn:nth-child(3) { animation-delay: 0.15s; }
    .link-btn:nth-child(4) { animation-delay: 0.20s; }
    .link-btn:nth-child(5) { animation-delay: 0.25s; }

    .link-btn:hover {
      background: #2c2820;
      border-color: var(--border-hover);
      color: var(--text);
    }

    .link-icon {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-label { flex: 1; }

    .link-arrow {
      font-size: 12px;
      color: var(--arrow);
      transition: color 0.15s;
    }

    .link-btn:hover .link-arrow { color: var(--text-muted); }

    .footer {
      margin-top: 30px;
      font-size: 11px;
      color: #3a3428;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">🌙</div>
    <p class="name">JensenVT</p>
    <p class="tagline">come hang. it's calm here.</p>

    <div class="links">

      <a class="link-btn" href="https://youtube.com/@JensenVT" target="_blank" rel="noopener">
        <div class="link-icon" style="background:#2a1f1f;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z" fill="#c0392b" opacity="0.85"/>
            <polygon points="9.75,15.02 15.5,12 9.75,8.98 9.75,15.02" fill="#e8e0d0" opacity="0.9"/>
          </svg>
        </div>
        <span class="link-label">YouTube</span>
        <span class="link-arrow">↗</span>
      </a>

      <a class="link-btn" href="https://twitch.tv/JensenVT" target="_blank" rel="noopener">
        <div class="link-icon" style="background:#1e1a2a;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#9b7fd4" opacity="0.85">
            <path d="M4.3 2L2 7.5V20h4.5v2.5h2.5L11.5 20H15l5-5V2H4.3zM18.5 14l-3 3h-4l-2.5 2.5V17H5.5V4h13v10z"/>
            <path d="M15.5 7h-1.8v5h1.8V7zM10.8 7H9v5h1.8V7z"/>

        </div>
        <span class="link-label">Twitch</span>
        <span class="link-arrow">↗</span>

      <a class="link-btn" href="https://tiktok.com/@JensenVT" target="_blank" rel="noopener">
        <div class="link-icon" style="background:#1a1f2a;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#c8bfae" opacity="0.85">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.75a4.85 4.85 0 0 1-1.01-.06z"/>
          </svg>
        </div>

      <a class="link-btn" href="https://instagram.com/JensenVT" target="_blank" rel="noopener">
        <div class="link-icon" style="background:#1f1a24;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="2" width="20" height="20" rx="5" stroke="#b088c0" stroke-width="1.5" opacity="0.8"/>
            <circle cx="12" cy="12" r="4" stroke="#b088c0" stroke-width="1.5" opacity="0.8"/>
            <circle cx="17.5" cy="6.5" r="1" fill="#b088c0" opacity="0.8"/>
          </svg>
        </div>
        <span class="link-label">Instagram</span>
        <span class="link-arrow">↗</span>
      </a>

      <a class="link-btn" href="https://gumroad.com/JensenVT" target="_blank" rel="noopener">
        <div class="link-icon" style="background:#1a2018;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="#7aab6a" stroke-width="1.5" opacity="0.8"/>
            <path d="M12 8v4l3 3" stroke="#7aab6a" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
          </svg>
        </div>
        <span class="link-label">Gumroad</span>
        <span class="link-arrow">↗</span>
      </a>

    </div>
    <p class="footer">jensenVT</p>
  </div>
</body>
</html>
